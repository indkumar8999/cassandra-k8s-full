apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: cassandra-lab
spec:
  serviceName: cassandra
  replicas: 3
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      terminationGracePeriodSeconds: 180
      affinity:
        # Cassandra only on workers w1–w4 (hot spare w4 for cassandra-3 on elastic 3→4→3). Excludes cp1.
        # Node names must match `kubectl get nodes`. Chaos-injector stays off w4 via its own affinity.
        # If a pod is Pending: PVC may be bound to cp1 from before this affinity — delete that ordinal's PVC (see README).
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - w1
                      - w2
                      - w3
                      - w4
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cassandra
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cassandra
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cassandra
      containers:
        - name: cassandra
          image: cassandra:4.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7000
              name: intra-node
            - containerPort: 7001
              name: tls-intra-node
            - containerPort: 7199
              name: jmx
            - containerPort: 9042
              name: cql
          env:
            - name: CASSANDRA_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: cassandra-config
                  key: CASSANDRA_CLUSTER_NAME
            - name: CASSANDRA_DC
              valueFrom:
                configMapKeyRef:
                  name: cassandra-config
                  key: CASSANDRA_DC
            - name: CASSANDRA_RACK
              valueFrom:
                configMapKeyRef:
                  name: cassandra-config
                  key: CASSANDRA_RACK
            - name: CASSANDRA_ENDPOINT_SNITCH
              valueFrom:
                configMapKeyRef:
                  name: cassandra-config
                  key: CASSANDRA_ENDPOINT_SNITCH
            - name: MAX_HEAP_SIZE
              valueFrom:
                configMapKeyRef:
                  name: cassandra-config
                  key: MAX_HEAP_SIZE
            - name: HEAP_NEWSIZE
              valueFrom:
                configMapKeyRef:
                  name: cassandra-config
                  key: HEAP_NEWSIZE
            - name: CASSANDRA_SEEDS
              value: "cassandra-0.cassandra.cassandra-lab.svc.cluster.local"
            - name: CASSANDRA_LISTEN_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CASSANDRA_BROADCAST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CASSANDRA_RPC_ADDRESS
              value: "0.0.0.0"
            - name: CASSANDRA_BROADCAST_RPC_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES'"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "env -u JVM_OPTS nodetool status | grep UN"
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
          # Raised vs legacy 500m/1Gi so Tier-A dashboards show noticeable reservation on 2 vCPU / ~4GiB workers.
          # One Cassandra pod per worker (anti-affinity); keep limits within a single Multipass VM (~4Gi allocatable).
          resources:
            requests:
              cpu: "900m"
              memory: "1536Mi"
            limits:
              cpu: "1500m"
              memory: "2560Mi"
  volumeClaimTemplates:
    - metadata:
        name: cassandra-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

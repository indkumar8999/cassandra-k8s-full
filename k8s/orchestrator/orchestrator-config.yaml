apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-orchestrator-config
  namespace: cassandra-lab
data:
  SIMULATOR_BASE: "http://cassandra-simulator:8080"
  LEARNER_BASE: "http://ubl-learner:8100"
  CHAOS_BASE: "http://chaos-injector:8200"
  TARGET_NAMESPACE: "cassandra-lab"
  LOAD_PROFILE: "high"
  FAULT_PROFILE: "network-congestion-like"
  NORMAL_SEC: "60"
  LOAD_SEC: "60"
  CHAOS_SEC: "120"
  COOLDOWN_SEC: "60"
  BOOTSTRAP_TIMEOUT_SEC: "900"
  OUTPUT_DIR: "/artifacts"

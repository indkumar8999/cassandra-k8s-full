            values ({pk}, {ck}, {payload}, {time}) USING TTL <<ttlsec:60>> AND TIMESTAMP {ts};

  ttl_read.yaml: |
    description: Read phase after TTL expiry window (same table as ttl_write).
    scenarios:
      default:
        main: run driver=cql tags==block:main-read cycles===TEMPLATE(main-cycles,1500000) threads=auto
    bindings:
      pk: Hash(); Mod(2000000); ToString();
      ck: Hash(); Mod(1000000); ToString();
    blocks:

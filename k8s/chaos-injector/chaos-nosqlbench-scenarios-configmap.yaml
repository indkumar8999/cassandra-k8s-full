# NoSQLBench 5 workload snippets for chaos-injector /start_nosqlbench.
# Mount as a volume at /scenarios in Job pods (see chaos-injector main.py).
# Uses driver=cql (same family as upstream cql-starter examples).
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-nosqlbench-scenarios
  namespace: cassandra-lab
data:
  baseline_normal.yaml: |
    description: |
      Balanced read/write baseline (cassandra-stress baseline-normal analogue).
    scenarios:
      default:
        schema: run driver=cql tags==block:schema threads==1 cycles==UNDEF
        rampup: run driver=cql tags==block:rampup cycles===TEMPLATE(rampup-cycles,2000) threads=auto
        main: run driver=cql tags==block:"main-.*" cycles===TEMPLATE(main-cycles,1000000) threads=auto
    bindings:
      pk: Hash(); Mod(1000000); ToString();
      ck: Hash(); Mod(1000000); ToString();
      payload: Hash(); ToString();
      time: ElapsedNanoTime(); Mul(1000); ToJavaInstant();
      ts: ElapsedNanoTime(); Mul(1000);
    blocks:
      schema:
        params:
          prepared: false
        ops:
          ks: |
            create keyspace if not exists <<keyspace:starter>>
            WITH replication = {'class': 'SimpleStrategy', 'replication_factor': '<<rf:3>>'};
          tb: |
            create table if not exists <<keyspace:starter>>.<<table:nbbase>> (
              pk text,
              ck text,
              payload text,
              time timestamp,
              primary key (pk, ck)
            ) WITH CLUSTERING ORDER BY (ck ASC);
      rampup:
        params:
          cl: LOCAL_ONE
          idempotent: true
        ops:
          ins: |
            insert into <<keyspace:starter>>.<<table:nbbase>> (pk, ck, payload, time)
            values ({pk}, {ck}, {payload}, {time}) USING TIMESTAMP {ts};
      main-read:
        params:
          ratio: TEMPLATE(read_ratio,5)
          cl: LOCAL_ONE
        ops:
          sel: |
            select * from <<keyspace:starter>>.<<table:nbbase>> where pk={pk} limit 1;
      main-write:
        params:
          ratio: TEMPLATE(write_ratio,5)
          cl: LOCAL_ONE
          idempotent: true
        ops:
          ins: |
            insert into <<keyspace:starter>>.<<table:nbbase>> (pk, ck, payload, time)
            values ({pk}, {ck}, {payload}, {time}) USING TIMESTAMP {ts};

  hot_partition.yaml: |
    description: |
      Writes to a single partition key (hot partition), analogous to cassandra-stress hot-partition recipe.
    scenarios:
      default:
        schema: run driver=cql tags==block:schema threads==1 cycles==UNDEF

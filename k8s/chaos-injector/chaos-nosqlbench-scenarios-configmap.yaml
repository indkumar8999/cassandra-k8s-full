        main: run driver=cql tags==block:main-write cycles===TEMPLATE(main-cycles,1000000) threads=auto
    bindings:
      pk: FixedValue('HOT');
      ck: Hash(); Mod(100000000); ToString();
      payload: Hash(); ToString();
      time: ElapsedNanoTime(); Mul(1000); ToJavaInstant();
      ts: ElapsedNanoTime(); Mul(1000);
    blocks:
      schema:
        params:
          prepared: false
        ops:
          ks: |
            create keyspace if not exists <<keyspace:starter>>
            WITH replication = {'class': 'SimpleStrategy', 'replication_factor': '<<rf:3>>'};
          tb: |
            create table if not exists <<keyspace:starter>>.<<table:hot>> (
              pk text,
              ck text,
              payload text,
              time timestamp,
              primary key (pk, ck)
            ) WITH CLUSTERING ORDER BY (ck ASC);
      rampup:
        params:
          cl: LOCAL_ONE
          idempotent: true
        ops:
          ins: |
            insert into <<keyspace:starter>>.<<table:hot>> (pk, ck, payload, time)
            values ({pk}, {ck}, {payload}, {time}) USING TIMESTAMP {ts};
      main-write:
        params:
          cl: LOCAL_ONE
          idempotent: true
        ops:
          ins: |
            insert into <<keyspace:starter>>.<<table:hot>> (pk, ck, payload, time)
            values ({pk}, {ck}, {payload}, {time}) USING TIMESTAMP {ts};

  compaction_pressure.yaml: |
    description: |
      Wide rows / larger payloads to increase compaction pressure (analogous to cassandra-stress n=8 size=2048).
    scenarios:
      default:
        schema: run driver=cql tags==block:schema threads==1 cycles==UNDEF
        rampup: run driver=cql tags==block:rampup cycles===TEMPLATE(rampup-cycles,5000) threads=auto
        main: run driver=cql tags==block:main-write cycles===TEMPLATE(main-cycles,2000000) threads=auto
    bindings:
      pk: Hash(); Mod(100000); ToString();
      c1: Hash(); Mod(8); ToString();
      payload: NumberNameToString();
      time: ElapsedNanoTime(); Mul(1000); ToJavaInstant();
      ts: ElapsedNanoTime(); Mul(1000);
    blocks:

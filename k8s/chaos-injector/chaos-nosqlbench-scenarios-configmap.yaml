  ttl_write.yaml: |
    description: TTL write phase (uses TTL template param ttlsec).
    scenarios:
      default:
        schema: run driver=cql tags==block:schema threads==1 cycles==UNDEF
        rampup: run driver=cql tags==block:rampup cycles===TEMPLATE(rampup-cycles,2000) threads=auto
        main: run driver=cql tags==block:main-write cycles===TEMPLATE(main-cycles,2000000) threads=auto

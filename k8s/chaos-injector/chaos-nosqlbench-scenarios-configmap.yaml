              pk text,
              c1 text,
              payload text,
              time timestamp,
              primary key (pk, c1)
            );
      rampup:
        params:
          cl: LOCAL_ONE
          idempotent: true
        ops:
          ins: |
            insert into <<keyspace:starter>>.<<table:compact>> (pk, c1, payload, time)
            values ({pk}, {c1}, {payload}, {time}) USING TIMESTAMP {ts};
      main-write:
        params:
          cl: LOCAL_ONE

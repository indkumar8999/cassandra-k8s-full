apiVersion: v1
kind: ConfigMap
metadata:
  name: ubl-learner-config
  namespace: cassandra-lab
data:
  PROMETHEUS_BASE: "http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090"
  TARGET_NAMESPACE: "cassandra-lab"
  # cassandra-0 is currently Pending; excluding it keeps samples "valid" while the pod is rescheduled.
  CASSANDRA_PODS: "cassandra-0,cassandra-1,cassandra-2"
  POLL_SEC: "0.5"
  BOOTSTRAP_SAMPLES: "350"
  SOM_ROWS: "32"
  SOM_COLS: "32"
  SOM_LR: "0.7"
  SOM_SIGMA: "4.0"
  TRAIN_EPOCHS: "10"
  THRESHOLD_PERCENTILE: "85"
  ANOMALY_STREAK: "3"
  SMOOTH_K: "5"
  CAUSE_Q: "5"
  ONLINE_UPDATE_ENABLED: "1"
  THRESHOLD_RECALC_ENABLED: "0"
  THRESHOLD_RECALC_EVERY_UPDATES: "25"
  PROM_QUERY_WORKERS: "1"
  PROM_QUERY_TIMEOUT_SEC: "3.0"
  # Pretrained SOM baked into learner image at /models/som_trained_snapshot.json (see ubl-learner/Dockerfile).
  UBL_SNAPSHOT_PATH: "/models/som_trained_snapshot.json"

specname: university_profile_2min
keyspace: university

keyspace_definition: |
  CREATE KEYSPACE IF NOT EXISTS university
  WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 3};

table: course_enrollment

table_definition: |
  CREATE TABLE IF NOT EXISTS university.course_enrollment (
      university_id text,
      term text,
      course_id text,
      section_id text,
      enrollment_id timeuuid,
      student_id text,
      student_name text,
      student_email text,
      student_year text,
      teacher_id text,
      teacher_name text,
      teacher_email text,
      staff_id text,
      staff_name text,
      department text,
      course_name text,
      course_level int,
      building text,
      room text,
      status text,
      grade text,
      credits int,
      created_at timestamp,
      PRIMARY KEY ((university_id, term), course_id, section_id, enrollment_id)
  ) WITH CLUSTERING ORDER BY (course_id ASC, section_id ASC, enrollment_id DESC);

columnspec:
  - name: university_id
    population: fixed(1)
    size: fixed(8)

  - name: term
    population: uniform(1..4)
    size: uniform(8..12)

  - name: course_id
    population: uniform(1..500)
    size: uniform(6..12)

  - name: section_id
    population: uniform(1..10)
    size: uniform(3..6)

  - name: enrollment_id
    cluster: fixed(100)

  - name: student_id
    population: uniform(1..50000)
    size: uniform(8..14)

  - name: student_name
    size: uniform(8..30)

  - name: student_email
    size: uniform(15..40)

  - name: student_year
    population: uniform(1..4)
    size: uniform(6..12)

  - name: teacher_id
    population: uniform(1..3000)
    size: uniform(8..14)

  - name: teacher_name
    size: uniform(8..30)

  - name: teacher_email
    size: uniform(15..40)

  - name: staff_id
    population: uniform(1..5000)
    size: uniform(8..14)

  - name: staff_name
    size: uniform(8..30)

  - name: department
    population: uniform(1..30)
    size: uniform(5..20)

  - name: course_name
    size: gaussian(10..50)

  - name: course_level
    population: uniform(1..5)

  - name: building
    population: uniform(1..20)
    size: uniform(4..15)

  - name: room
    population: uniform(1..100)
    size: uniform(3..8)

  - name: status
    population: uniform(1..3)
    size: uniform(8..12)

  - name: grade
    population: uniform(1..10)
    size: uniform(1..3)

  - name: credits
    population: uniform(1..4)

  - name: created_at
    cluster: fixed(100)

insert:
  partitions: fixed(1)
  select: fixed(1)/100
  batchtype: UNLOGGED

queries:
  # Primary-key query
  course_section_enrollments:
    cql: SELECT * FROM university.course_enrollment
         WHERE university_id = ? AND term = ? AND course_id = ? AND section_id = ?
    fields: samerow

  # Secondary-index style query
  by_student_id:
    cql: SELECT * FROM university.course_enrollment
         WHERE student_id = ?
    fields: samerow

  # Secondary-index style query
  by_teacher_id:
    cql: SELECT * FROM university.course_enrollment
         WHERE teacher_id = ?
    fields: samerow

  # Join-like denormalized lookup
  student_courses_lookup:
    cql: SELECT student_id, student_name, course_id, course_name, section_id, teacher_name, department, status
         FROM university.course_enrollment
         WHERE student_id = ?
    fields: samerow

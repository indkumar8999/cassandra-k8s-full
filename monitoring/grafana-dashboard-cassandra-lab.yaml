              "unit": "cores"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",

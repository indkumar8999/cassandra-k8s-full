apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cassandra-lab-demo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cassandra-lab-demo.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "enable": true,
            "expr": "changes(simulator_profile_state{namespace=\"$namespace\",profile=~\"$scenario\"}[1m]) > 0",
            "hide": false,
            "iconColor": "rgba(255, 167, 0, 1)",
            "name": "Scenario switch",
            "showIn": 0,
            "step": "15s",
            "tagKeys": "profile",
            "textFormat": "Scenario change",
            "titleFormat": "{{profile}}",
            "type": "tags"
          },
          {
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "enable": true,
            "expr": "increase(ubl_demo_event_total{namespace=\"$namespace\"}[30s]) > 0",
            "hide": false,
            "iconColor": "rgba(31, 120, 193, 1)",
            "name": "Demo automation events",
            "showIn": 0,
            "step": "15s",
            "tagKeys": "event,source",
            "textFormat": "demo event",
            "titleFormat": "{{event}}",
            "type": "tags"
          }
        ]
      },
      "description": "Demo dashboard: Cassandra lab load profiles (scenarios) + Tier A/B style metrics in real time.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Scenario (load profile) + cluster overview",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 16,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "max by (profile) (simulator_profile_state{namespace=\"$namespace\",profile=~\"$scenario\"})",
              "legendFormat": "{{profile}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Active scenario (one-hot)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": true,
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "id": 3,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "pod"
              }
            ]
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "editorMode": "code",
              "expr": "kube_pod_info{namespace=\"$namespace\",pod=~\"$pod\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Cluster map (pod → node)",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "namespace": true,
                  "pod_ip": true,
                  "service": true,
                  "uid": true
                },
                "indexByName": {},
                "renameByName": {
                  "node": "node",
                  "pod": "pod",
                  "host_ip": "host_ip"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 10,
          "panels": [],
          "title": "Per-metric load profiles (Tier A style)",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true
